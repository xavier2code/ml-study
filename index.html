<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ML 学习路线 · 22 周</title>
<meta name="description" content="22 周 / 160 天机器学习·深度学习·大模型原理学习路线：每日内容 + 互动原理图 + 掌握测验，进度本地保存。" />
<meta property="og:title" content="ML 学习路线 · 22 周" />
<meta property="og:description" content="160 天从经典 ML 到 LLM/Agent 的完整学习路径，含互动原理图与每日测验。" />
<meta property="og:type" content="website" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#0f1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ML 学习" />
<script>
  // 提前落主题 class，避免刷新闪深色（默认跟随系统，手动切换后记住选择）
  try {
    var t = localStorage.getItem("ml-theme-v1");
    if (t === "light" || (!t && matchMedia("(prefers-color-scheme: light)").matches)) {
      document.documentElement.classList.add("light");
    }
  } catch { }
</script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1d2230;
    --line: #2a3142;
    --text: #e6e9ef;
    --text-dim: #8d97aa;
    --accent: #4c8dff;
    --accent-2: #ffb454;
    --high: #ff6464;
    --med: #ffd24c;
    --ok: #62d48f;
    --hi-prio: #ff6464;
    --med-prio: #ffd24c;
    --code-bg: #0a0c10;
    --code-fg: #c8d0db;
    --header-bg: rgba(15, 17, 21, 0.92);
    --hover-bg: #232a3a;
    --m-grad: #1f1424;
    --m-border: #4a2438;
  }
  html.light {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --panel-2: #edf0f6;
    --line: #d5dbe7;
    --text: #1f2430;
    --text-dim: #5c6678;
    --accent: #1d5ee0;
    --accent-2: #b4530a;
    --high: #d43a3a;
    --med: #9a6b00;
    --ok: #15803d;
    --hi-prio: #d43a3a;
    --med-prio: #9a6b00;
    --code-bg: #e9edf3;
    --code-fg: #2a3142;
    --header-bg: rgba(244, 246, 250, 0.92);
    --hover-bg: #e2e8f3;
    --m-grad: #f6ecf9;
    --m-border: #dfc2e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    background: var(--header-bg);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px; font-weight: 600; margin: 0;
    letter-spacing: 0.2px;
  }
  header h1 .sub {
    color: var(--text-dim); font-weight: 400; font-size: 13px; margin-left: 8px;
  }
  .progress-wrap {
    flex: 1;
    display: flex; align-items: center; gap: 10px;
  }
  .progress-bar {
    flex: 1; height: 6px; background: var(--panel-2);
    border-radius: 3px; overflow: hidden; max-width: 320px;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok));
    width: 0%; transition: width 200ms ease;
  }
  .progress-text { color: var(--text-dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .stat {
    color: var(--text-dim); font-size: 12px;
    border-left: 1px solid var(--line); padding-left: 12px;
  }
  .stat strong { color: var(--text); font-weight: 600; }

  /* ---------- layout ---------- */
  main {
    display: grid;
    grid-template-columns: 320px 1fr;
    min-height: calc(100vh - 60px);
  }

  /* ---------- sidebar (weeks) ---------- */
  aside {
    border-right: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 0;
    overflow-y: auto;
    max-height: calc(100vh - 60px);
    position: sticky; top: 60px;
  }
  .phase-block { margin-bottom: 4px; }
  .phase-header {
    padding: 10px 16px 6px;
    color: var(--text-dim);
    font-size: 11px; font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .phase-header .phase-name { color: var(--text); }
  .week {
    border-top: 1px dashed var(--line);
  }
  .week:first-child { border-top: none; }
  .week-label {
    padding: 8px 16px;
    cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px;
    user-select: none;
  }
  .week-label:hover { background: var(--panel-2); }
  .week-label .week-days {
    color: var(--text-dim); font-size: 11px;
  }
  .week-label .week-check {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid var(--line); flex: 0 0 10px;
  }
  .week-label .week-check.done { background: var(--ok); border-color: var(--ok); }
  .week-label .week-check.partial { background: var(--med); border-color: var(--med); }
  .week-days-list {
    padding: 0 0 6px 0; display: none;
  }
  .week.open .week-days-list { display: block; }
  .week.open .week-label .caret { transform: rotate(90deg); }
  .caret {
    transition: transform 120ms ease; color: var(--text-dim);
    display: inline-block; width: 12px;
  }
  .day-link {
    display: block;
    padding: 6px 16px 6px 36px;
    color: var(--text);
    font-size: 13px;
    border-left: 2px solid transparent;
    cursor: pointer;
  }
  .day-link:hover { background: var(--panel-2); }
  .day-link.active {
    background: var(--panel-2);
    border-left-color: var(--accent);
  }
  .day-link .day-num {
    color: var(--text-dim); font-variant-numeric: tabular-nums;
    font-size: 11px; margin-right: 8px; display: inline-block; min-width: 28px;
  }
  .day-link.done .day-num { color: var(--ok); }
  .day-link.has-figure::after {
    content: "◆"; color: var(--accent-2); margin-left: 6px; font-size: 10px;
  }
  .day-link.milestone .day-num { color: var(--hi-prio); font-weight: 600; }

  /* ---------- main content ---------- */
  .content {
    padding: 24px 32px 80px;
    max-width: 920px;
  }
  .day-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px 28px;
    margin-bottom: 24px;
  }
  .day-head {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .day-badge {
    background: var(--panel-2);
    color: var(--text-dim);
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }
  .day-title {
    font-size: 20px; font-weight: 600; margin: 0;
  }
  .day-hours {
    color: var(--accent-2); font-size: 13px;
    font-weight: 600; margin-left: auto;
  }
  .day-summary {
    color: var(--text-dim); margin: 8px 0 16px;
  }
  .day-figure {
    margin: 20px 0 24px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--code-bg);
    padding: 16px;
  }
  .day-figure img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  .day-figure .fig-slot {
    min-height: 200px;
    display: flex; align-items: center; justify-content: center;
    background:
      linear-gradient(45deg, var(--code-bg) 25%, transparent 25%),
      linear-gradient(-45deg, var(--code-bg) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--code-bg) 75%),
      linear-gradient(-45deg, transparent 75%, var(--code-bg) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    background-color: var(--code-bg);
    border-radius: 4px;
  }
  .day-figure .fig-placeholder { text-align: center; color: var(--text-dim); }
  .day-figure .fig-icon { font-size: 32px; margin-bottom: 8px; color: var(--accent-2); }
  .day-figure .fig-hint { font-size: 11px; margin-top: 6px; opacity: 0.7; }
  .day-figure .fig-slot img { display: block; }
  .day-figure .fig-slot iframe { width: 100%; height: 740px; border: 0; display: block; background: transparent; }
  .day-figure .fig-caption {
    color: var(--text-dim); font-size: 12px; margin-top: 8px; text-align: center;
  }
  .day-figure .fig-missing {
    color: var(--text-dim); font-size: 13px; text-align: center;
    padding: 32px 16px;
  }
  .day-figure .fig-missing code {
    background: var(--code-bg); padding: 1px 6px; border-radius: 3px;
    color: var(--accent-2);
  }

  .sub-task {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 10px; margin: 4px 0;
    background: var(--panel-2);
    border-radius: 6px;
    cursor: pointer;
    transition: background 120ms;
  }
  .sub-task:hover { background: var(--hover-bg); }
  .sub-task input[type="checkbox"] {
    margin-top: 2px; flex: 0 0 auto;
    accent-color: var(--ok);
  }
  .sub-task .sub-name { flex: 1; }
  .sub-task .sub-hours {
    color: var(--accent-2); font-size: 12px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .sub-task.done .sub-name { color: var(--text-dim); text-decoration: line-through; }

  .ref-line {
    color: var(--text-dim); font-size: 12px;
    margin-top: 12px;
  }

  .milestone-card {
    background: linear-gradient(135deg, var(--m-grad) 0%, var(--panel) 100%);
    border: 1px solid var(--m-border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .milestone-card .m-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .milestone-card .m-tag {
    background: var(--hi-prio);
    color: #fff; font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 3px; letter-spacing: 0.5px;
  }
  .milestone-card .m-title { font-size: 16px; font-weight: 600; }
  .milestone-card .m-day { color: var(--text-dim); font-size: 12px; margin-left: auto; }
  .milestone-card .m-crit { color: var(--text-dim); margin: 8px 0 12px; }
  .milestone-card .m-list { font-size: 13px; }
  .milestone-card .m-list div { padding: 4px 0; }
  .milestone-card .m-list .check {
    color: var(--ok); margin-right: 8px; font-weight: 700;
  }

  /* ---------- empty / loading ---------- */
  .empty {
    text-align: center; color: var(--text-dim);
    padding: 80px 20px;
  }
  .empty h2 { color: var(--text); font-weight: 600; }

  /* ---------- responsive ---------- */
  /* ============ study content + quiz ============ */
  .study { margin-top: 26px; }
  .study-head {
    font-size: 15px; font-weight: 600; color: var(--accent);
    margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .study-loading, .study-missing {
    color: var(--text-dim); font-size: 13px;
    padding: 24px 16px; border: 1px dashed var(--line); border-radius: 10px;
    text-align: center;
  }
  .study-sec { margin-bottom: 22px; }
  .sec-h {
    font-size: 14px; font-weight: 600; margin: 0 0 10px 0;
    color: var(--text); display: flex; align-items: center; gap: 8px;
  }
  .sec-h::before { content: ""; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; flex: 0 0 3px; }
  .md-p { font-size: 13.5px; line-height: 1.75; margin: 8px 0; color: var(--text); }
  .md-h2 { font-size: 14px; font-weight: 600; margin: 16px 0 6px; color: var(--accent-2); }
  .md-h3 { font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--accent-2); }
  .md-ul, .md-ol { margin: 8px 0 8px 20px; padding: 0; }
  .md-ul li, .md-ol li { font-size: 13.5px; line-height: 1.7; margin: 4px 0; color: var(--text); }
  .md-ul { list-style: disc; } .md-ol { list-style: decimal; }
  .md-quote {
    border-left: 3px solid var(--accent); background: var(--panel-2);
    margin: 10px 0; padding: 8px 14px; border-radius: 0 8px 8px 0;
    font-size: 13px; color: var(--text-dim); line-height: 1.7;
  }
  .md-ic {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; font-size: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .md-code {
    background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px; overflow-x: auto;
    margin: 10px 0; font-size: 12.5px; line-height: 1.6;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .md-table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 13px; }
  .md-table th, .md-table td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .md-table th { background: var(--panel-2); color: var(--text-dim); font-weight: 600; }
  .keypoints {
    background: linear-gradient(135deg, rgba(255,184,0,.06), rgba(255,184,0,.02));
    border: 1px solid rgba(255,184,0,.25); border-radius: 10px;
    padding: 14px 18px; margin: 20px 0;
  }
  .kp-h { font-size: 13px; font-weight: 600; color: #ffb400; margin-bottom: 8px; }
  .keypoints ul { margin: 0; padding-left: 20px; list-style: "·"; }
  .keypoints li { font-size: 13px; line-height: 1.7; margin: 4px 0; }
  .quiz {
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--panel-2); padding: 16px 18px; margin: 20px 0;
  }
  .quiz-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; font-weight: 600; margin-bottom: 4px;
  }
  .quiz-rule { font-size: 11.5px; color: var(--text-dim); font-weight: 400; }
  .quiz-prev { margin-left: 10px; color: var(--ok); }
  .quiz-q { padding: 12px 0; border-top: 1px solid var(--line); }
  .qq { font-size: 13.5px; font-weight: 500; margin-bottom: 8px; line-height: 1.6; display: flex; gap: 8px; }
  .qn {
    flex: 0 0 20px; height: 20px; border-radius: 50%; background: var(--panel);
    border: 1px solid var(--line); font-size: 11px; color: var(--text-dim);
    display: inline-flex; align-items: center; justify-content: center; margin-top: 2px;
  }
  .quiz-q.correct .qn { background: var(--ok); border-color: var(--ok); color: #fff; }
  .quiz-q.wrong .qn { background: var(--bad, #e5534b); border-color: var(--bad, #e5534b); color: #fff; }
  .qo {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 7px 10px; margin: 4px 0; border-radius: 8px;
    border: 1px solid transparent; cursor: pointer; font-size: 13px; line-height: 1.6;
  }
  .qo:hover { background: var(--panel); }
  .qo input { margin-top: 3px; }
  .quiz-q.correct .qo.is-answer { border-color: var(--ok); background: rgba(63,185,80,.08); }
  .quiz-q.wrong .qo.is-answer { border-color: var(--ok); background: rgba(63,185,80,.08); }
  .quiz-q.wrong .qo.is-wrong { border-color: var(--bad, #e5534b); background: rgba(229,83,75,.08); }
  .q-explain {
    display: none; margin-top: 8px; padding: 10px 12px;
    background: var(--panel); border-radius: 8px;
    font-size: 12.5px; color: var(--text-dim); line-height: 1.7;
  }
  .quiz-warn { display: none; color: var(--bad, #e5534b); font-size: 12.5px; margin-top: 8px; }
  .quiz-result {
    display: none; justify-content: space-between; align-items: center;
    margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; font-weight: 600;
  }
  .quiz-result.pass { display: flex; background: rgba(63,185,80,.1); border: 1px solid var(--ok); color: var(--ok); }
  .quiz-result.fail { display: flex; background: rgba(229,83,75,.08); border: 1px solid var(--bad, #e5534b); color: var(--bad, #e5534b); }
  .quiz-actions { margin-top: 14px; display: flex; gap: 10px; }
  .quiz-submit, .quiz-retry {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 9px 22px; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .quiz-retry { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  .mastery-badge {
    display: inline-block; background: rgba(63,185,80,.12); color: var(--ok);
    border: 1px solid var(--ok); border-radius: 20px;
    font-size: 11px; font-weight: 600; padding: 3px 10px; margin-left: 10px;
  }
  .day-link .ml-mark { color: var(--ok); font-size: 11px; margin-left: 6px; }

  /* ============ 导航 / 搜索 / 错题复习 ============ */
  .day-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .nav-btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 16px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .nav-hint { font-size: 11.5px; color: var(--text-dim); }
  .search-wrap { margin-left: auto; }
  #searchInput {
    width: 220px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 12px; font-size: 12.5px; outline: none;
  }
  #searchInput:focus { border-color: var(--accent); }
  #searchInput::placeholder { color: var(--text-dim); }
  mark { background: rgba(76,141,255,.35); color: var(--text); border-radius: 2px; padding: 0 1px; }
  .sr-head { font-size: 14px; font-weight: 600; color: var(--text); margin: 4px 0 14px; }
  .sr-item {
    display: block; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    padding: 12px 16px; margin-bottom: 10px; cursor: pointer; text-decoration: none;
  }
  .sr-item:hover { border-color: var(--accent); }
  .sr-title { font-size: 13.5px; font-weight: 600; color: var(--text); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .sr-day { color: var(--accent); font-size: 12px; flex: 0 0 auto; }
  .sr-snip { font-size: 12.5px; color: var(--text-dim); line-height: 1.7; margin: 3px 0; }
  .sr-sec { color: var(--accent-2); font-size: 11.5px; margin-right: 6px; }
  .rv-q-tag { font-size: 11.5px; color: var(--accent-2); margin-bottom: 6px; }
  .rv-empty { text-align: center; color: var(--text-dim); padding: 60px 0; font-size: 14px; line-height: 2; }
  .back-btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 18px; font-size: 12.5px; cursor: pointer; margin-top: 16px;
  }
  .back-btn:hover { border-color: var(--accent); }

  /* ============ 导出/导入 ============ */
  .io-btns { display: flex; gap: 6px; }
  .io-btn {
    background: var(--panel-2); color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 10px; font-size: 11.5px; cursor: pointer;
    white-space: nowrap;
  }
  .io-btn:hover { color: var(--text); border-color: var(--accent); }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    aside { position: relative; max-height: none; top: 0; }
    .content { padding: 16px; }
    #searchInput { width: 130px; }
    .nav-hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>ML 学习路线 <span class="sub">22 周 · 6 Phase</span></h1>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 160</div>
  </div>
  <div class="stat"><strong id="hoursTotal">0h</strong> 已学</div>
  <div class="stat"><strong id="streakStat">0</strong> 连击</div>
  <div class="stat"><strong id="masterStat">0/160</strong> 掌握</div>
  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="🔍 搜索 160 天内容…" />
  </div>

// ============== helpers ==============
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function key(day, idx) { return day + "-" + idx; }
function isTaskDone(day, idx) { return !!CHECKLIST[key(day, idx)]; }
function setTaskDone(day, idx, v) { if (v) CHECKLIST[key(day, idx)] = 1; else delete CHECKLIST[key(day, idx)]; }
function isDayDone(day) {
  const d = DAYS.find(x => x.day === day);
  if (!d) return false;
  return d.subs.length > 0 && d.subs.every((_, i) => isTaskDone(day, i));
}
function dayProgress(day) {
  const d = DAYS.find(x => x.day === day);
  if (!d) return 0;
  if (d.subs.length === 0) return 0;
  const done = d.subs.filter((_, i) => isTaskDone(day, i)).length;
  return done / d.subs.length;
}
function weekProgress(days) {
  let total = 0, done = 0;
  for (const day of days) {
    const d = DAYS.find(x => x.day === day);
    if (!d) continue;
    total += d.subs.length;
    done += d.subs.filter((_, i) => isTaskDone(day, i)).length;
  }
  return total === 0 ? 0 : done / total;
}

function buildSidebar() {
  const aside = document.getElementById("sidebar");

  // The python script exports data; here we replicate grouping by day ranges
  // We re-import PHASES from python via embedded map for grouping
  const PHASE_RANGES = [
    { name: "Phase 0 — 数学与 Python 工具栈 (1 周)", start: 1,   end: 7   },
    { name: "Phase 1 — 经典机器学习 (4 周)",         start: 8,   end: 35  },
    { name: "Phase 2 — 深度学习基础 (5 周)",         start: 36,  end: 70  },
    { name: "Phase 3 — Transformer + 预训练 (4 周)", start: 71,  end: 98  },
    { name: "Phase 4 — LLM 深入 (5 周)",             start: 99,  end: 133 },
    { name: "Phase 5 — 工程 + Agent + 多模态 (3.86 周)", start: 134, end: 160 },
  ];
  // Week boundaries (Mon..Sun, Day 1 = Fri 2026-10-16)
  // Day 1 (Fri) -> start of week 1
  // We use 7-day weeks with carry-over
  // Manually assign Day ranges to weeks using offsets from start
  function weekForDay(d) {
    // Day 1..7 = Week 1, 8..14 = Week 2, etc.
    return Math.ceil(d / 7);
  }
  const html = [];
  for (const phase of PHASE_RANGES) {
    html.push(`<div class="phase-block">`);
    html.push(`<div class="phase-header"><span class="phase-name">${phase.name}</span></div>`);
    const weekNumbers = new Set();
    for (let d = phase.start; d <= phase.end; d++) {
      weekNumbers.add(weekForDay(d));
    }
    for (const wn of [...weekNumbers].sort((a,b)=>a-b)) {
      const daysInWeek = [];
      for (let d = phase.start; d <= phase.end; d++) {
        if (weekForDay(d) === wn) daysInWeek.push(d);
      }
      const wp = weekProgress(daysInWeek);
      let dotClass = "";
      if (wp === 1) dotClass = "done";
      else if (wp > 0) dotClass = "partial";
      const open = daysInWeek.includes(CURRENT_DAY) ? " open" : "";
      const dayList = daysInWeek.map(d => {
        const item = DAYS.find(x => x.day === d);
        if (!item) return "";
        const isMile = MILESTONES.some(m => m.day === d);
        const isCurr = d === CURRENT_DAY ? " active" : "";
        const done = isDayDone(d) ? " done" : "";
        const hasFig = FIGURES[d] ? " has-figure" : "";
        const mile = isMile ? " milestone" : "";
        const mk = isMastered(d) ? '<span class="ml-mark">✓</span>' : "";
        const title = item.title.length > 16 ? item.title.slice(0, 16) + "…" : item.title;
        return `<a class="day-link${isCurr}${done}${hasFig}${mile}" data-day="${d}" title="${escapeHtml(item.title)}">
          <span class="day-num">D${d}</span>${title}${mk}
        </a>`;
      }).join("");
      html.push(`<div class="week${open}" data-week="${wn}">
        <div class="week-label">
          <span><span class="caret">▶</span> Week ${wn} <span class="week-days">(${daysInWeek.length} 天)</span></span>
          <span class="week-check ${dotClass}"></span>
        </div>
        <div class="week-days-list">${dayList}</div>
      </div>`);
    }
    html.push(`</div>`);
  }
  setHTML(aside, html.join(""));
  // bind events
  aside.querySelectorAll(".week-label").forEach(el => {
    el.addEventListener("click", e => {
      e.currentTarget.parentElement.classList.toggle("open");
    });
  });
  aside.querySelectorAll(".day-link").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      const d = +el.dataset.day;
      showDay(d);
    });
  });
}

const CONTENT = new Map();

async function ensureContent(d) {
  if (CONTENT.has(d)) return CONTENT.get(d);
  const res = await fetch(`content/days/d${d}.json`);
  if (!res.ok) throw new Error("HTTP " + res.status);

}

async function loadContent(d) {
  const box = document.getElementById("study");

  if (CONTENT.has(d)) { renderStudy(d, CONTENT.get(d)); return; }
  setHTML(box, '<div class="study-loading">⏳ 加载学习内容…</div>');

    const c = await ensureContent(d);
    if (CURRENT_DAY === d) renderStudy(d, c);
  } catch (e) {
    setHTML(box, `<div class="study-missing">📖 本日学习内容尚未生成（后台 worker 正在分批生成，稍后刷新重试）。<br><code>content/days/d${d}.json</code></div>`);
  }
}

function mdInline(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code class="md-ic">$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return s;
}

function mdTable(rows) {
  const cells = rows.map(r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim()));
  const head = cells[0];
  const bodyStart = cells[1] && cells[1].every(c => /^:?-{2,}:?$/.test(c)) ? 2 : 1;
  const body = cells.slice(bodyStart);
  return `<table class="md-table"><thead><tr>${head.map(h => `<th>${mdInline(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function renderMd(md) {
  const fences = [];
  md = md.replace(/```[a-zA-Z]*\n([\s\S]*?)```/g, (m, code) => {
    fences.push('<pre class="md-code"><code>' + escapeHtml(code.replace(/\n$/, "")) + "</code></pre>");
    return "\u0001" + (fences.length - 1) + "\u0001";
  });
  const lines = md.split("\n");
  let html = "", ul = false, ol = false, quote = false, tbl = [];
  const closeLists = () => {
    if (ul) { html += "</ul>"; ul = false; }
    if (ol) { html += "</ol>"; ol = false; }
    if (quote) { html += "</blockquote>"; quote = false; }
  };
  const closeTable = () => { if (tbl.length) { html += mdTable(tbl); tbl = []; } };
  for (const line of lines) {
    if (/^\s*\|.*\|\s*$/.test(line)) { closeLists(); tbl.push(line); continue; }
    closeTable();
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
      closeLists();
      const lvl = Math.min(m[1].length, 3);
      html += `<div class="md-h${lvl}">${mdInline(m[2])}</div>`;
    } else if (/^\s*[-*]\s+/.test(line)) {
      if (ol) { html += "</ol>"; ol = false; }
      if (quote) { html += "</blockquote>"; quote = false; }
      if (!ul) { html += '<ul class="md-ul">'; ul = true; }
      html += `<li>${mdInline(line.replace(/^\s*[-*]\s+/, ""))}</li>`;
    } else if (/^\s*\d+\.\s+/.test(line)) {
      if (ul) { html += "</ul>"; ul = false; }
      if (quote) { html += "</blockquote>"; quote = false; }
      if (!ol) { html += '<ol class="md-ol">'; ol = true; }
      html += `<li>${mdInline(line.replace(/^\s*\d+\.\s+/, ""))}</li>`;
    } else if (/^>\s?/.test(line)) {
      closeLists();
      if (!quote) { html += '<blockquote class="md-quote">'; quote = true; }
      html += mdInline(line.replace(/^>\s?/, "")) + "<br>";
    } else if (/^\u0001\d+\u0001$/.test(line.trim())) {
      closeLists();
      html += fences[+line.trim().slice(1, -1)];
    } else if (/^\s*$/.test(line)) {
      closeLists();
    } else {
      closeLists();
      html += `<p class="md-p">${mdInline(line)}</p>`;
    }
  }
  closeLists(); closeTable();
  return html;
}

function renderStudy(d, c) {
  const box = document.getElementById("study");
  if (!box) return;
  const secs = (c.sections || []).map(s => `
    <section class="study-sec">
      <h3 class="sec-h">${escapeHtml(s.h)}</h3>
      ${renderMd(s.md || "")}
    </section>`).join("");
  const kps = (c.keyPoints || []).map(k => `<li>${mdInline(k)}</li>`).join("");
  const quizHtml = (c.quiz || []).map((q, i) => `
    <div class="quiz-q" data-qi="${i}">
      <div class="qq"><span class="qn">${i + 1}</span><span>${escapeHtml(q.q)}</span></div>
      ${q.options.map((o, j) => `<label class="qo"><input type="radio" name="q${i}" value="${j}"><span>${mdInline(o)}</span></label>`).join("")}
      <div class="q-explain">💡 ${escapeHtml(q.explain || "")}</div>

  const q = QUIZ[d];
  const prevBest = q ? ` · 历史最佳 ${q.best}/${q.total}${isMastered(d) ? " ✓" : ""}` : "";
  setHTML(box, `

      <div class="quiz-warn"></div>
      <div class="quiz-result"></div>
      <div class="quiz-actions">
        <button class="quiz-submit">提交答案</button>
        <button class="quiz-retry" style="display:none">重做测验</button>
      </div>
    </div>`);

function bindQuiz(day, quiz) {
  const box = document.getElementById("quiz");
  if (!box || !quiz.length) return;
  const submit = box.querySelector(".quiz-submit");
  const retry = box.querySelector(".quiz-retry");
  submit.addEventListener("click", () => {
    const answers = quiz.map((_, i) => {
      const sel = box.querySelector(`input[name="q${i}"]:checked`);
      return sel ? +sel.value : -1;
    });
    const unanswered = answers.filter(a => a < 0).length;
    const warn = box.querySelector(".quiz-warn");
    if (unanswered > 0) {
      warn.textContent = `还有 ${unanswered} 题未作答，全部作答后才能提交`;
      warn.style.display = "block";
      return;
    }
    warn.style.display = "none";
    let score = 0;
    quiz.forEach((q, i) => {
      const wrap = box.querySelector(`.quiz-q[data-qi="${i}"]`);
      const ok = answers[i] === q.answer;
      if (ok) score++;
      wrap.classList.add(ok ? "correct" : "wrong");
      wrap.querySelectorAll(".qo").forEach((lab, j) => {
        if (j === q.answer) lab.classList.add("is-answer");
        else if (j === answers[i]) lab.classList.add("is-wrong");
      });
      const ex = wrap.querySelector(".q-explain");
      if (ex) ex.style.display = "block";
    });
    // 错题本：答对移出，答错记入
    quiz.forEach((q, i) => {
      const k = day + "-" + i;
      if (answers[i] === q.answer) delete WRONG[k];
      else WRONG[k] = { day, qi: i, addedAt: Date.now() };
    });
    saveWrong(); updateWrongBtn();
    const pct = Math.round(score / quiz.length * 100);
    const passed = pct >= 80;
    const prev = QUIZ[day] || { best: 0, total: quiz.length };
    const wasMastered = isMastered(day);
    if (!prev || score > (prev.best || 0) || prev.total !== quiz.length) {
      QUIZ[day] = { best: Math.max(score, prev.best || 0), total: quiz.length };
      saveQuiz();
    }
    const res = box.querySelector(".quiz-result");
    res.className = "quiz-result " + (passed ? "pass" : "fail");
    setHTML(res, `<span>得分 ${score}/${quiz.length}（${pct}%）</span>` +
      (passed ? '<span class="res-tag">已掌握 ✓</span>' : '<span class="res-tag">未达 80%，复习要点后重试</span>'));
    submit.style.display = "none";
    retry.style.display = "inline-block";
    if (passed && !wasMastered) {
      const badge = document.querySelector(".day-head .mastery-badge");
      if (badge) badge.style.display = "inline-block";
      buildSidebar();
      updateMastery();
    }
    res.scrollIntoView({ block: "center", behavior: "smooth" });
  });
  retry.addEventListener("click", () => {
    if (CONTENT.has(day)) renderStudy(day, CONTENT.get(day));
  });
}

function renderMilestone(m) {
  const checks = m.checks.map(c => `<div><span class="check">✓</span>${escapeHtml(c)}</div>`).join("");
  return `<div class="milestone-card">
    <div class="m-head">
      <span class="m-tag">验收</span>
      <span class="m-title">${escapeHtml(m.phase)} 完成 → ${escapeHtml(m.title)}</span>
      <span class="m-day">Day ${m.day} / 160</span>
    </div>
    <div class="m-crit">${escapeHtml(m.crit)}</div>
    <div class="m-list">${checks}</div>
  </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// 统一渲染入口：DOMParser 惰性解析 + 消毒（去 script / on* 事件属性 / javascript: URL），
// 在既有 escape-first 模板外加一层纵深防御；渲染一律走它，不再直接 innerHTML
function setHTML(el, html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script").forEach(n => n.remove());
  doc.querySelectorAll("*").forEach(n => {
    for (const a of [...n.attributes]) {
      const name = a.name.toLowerCase();
      if (name.startsWith("on")) n.removeAttribute(a.name);
      else if ((name === "href" || name === "src" || name === "xlink:href") && /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name);
    }
  });
  el.replaceChildren(...doc.body.childNodes);
}

// ============== progress ==============
function updateProgress() {
  let total = 0, done = 0, hours = 0;
  let daysDone = 0;
  for (const d of DAYS) {
    total += d.subs.length;
    let allSub = true;
    for (let i = 0; i < d.subs.length; i++) {
      if (isTaskDone(d.day, i)) {
        done++;
        const h = parseFloat((d.subs[i].hours || "0").replace("h", ""));
        if (!isNaN(h)) hours += h;
      } else {
        allSub = false;
      }
    }
    if (d.subs.length > 0 && allSub) daysDone++;
  }
  const pct = total === 0 ? 0 : (done / total) * 100;
  const totalDays = DAYS.length;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${daysDone} / ${totalDays} 天`;
  document.getElementById("hoursTotal").textContent = hours.toFixed(1) + "h";
  // streak = consecutive done days from Day 1
  let streak = 0;
  for (const d of DAYS) {
    if (isDayDone(d.day)) streak++;
    else break;
  }
  document.getElementById("streakStat").textContent = streak;
  updateMastery();
}

// ============== 进度导出 / 导入 ==============
function exportProgress() {
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch (e) { return {}; } };
  const data = {
    app: "ml-study-site",
    version: 1,
    exportedAt: new Date().toISOString(),
    state: read(STORAGE_KEY),
    quiz: read(QUIZ_KEY),
    wrong: read(WRONG_KEY),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  a.href = url;
  a.download = `ml-progress-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importProgress(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.app !== "ml-study-site" || typeof data.state !== "object" || typeof data.quiz !== "object") {
        throw new Error("格式不对");
      }
      const tasks = data.state.checklist ? Object.keys(data.state.checklist).length : 0;
      const quizzes = Object.keys(data.quiz).length;
      if (!confirm(`导入 ${tasks} 天的任务勾选、${quizzes} 天的测验成绩？\n（将覆盖当前进度）`)) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data.state));
      localStorage.setItem(QUIZ_KEY, JSON.stringify(data.quiz));
      if (data.wrong && typeof data.wrong === "object") {
        localStorage.setItem(WRONG_KEY, JSON.stringify(data.wrong));
      }
      location.reload();
    } catch (e) {
      alert("导入失败：不是有效的进度备份文件（" + e.message + "）");
    }
  };
  reader.readAsText(file);
}

function bindIoButtons() {
  const btnE = document.getElementById("btnExport");
  const btnI = document.getElementById("btnImport");
  const fileInput = document.getElementById("importFile");
  if (!btnE || !btnI) return;
  btnE.addEventListener("click", exportProgress);
  btnI.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    if (fileInput.files && fileInput.files[0]) {
      importProgress(fileInput.files[0]);
      fileInput.value = "";
    }
  });
}

// ============== 主题(深/浅) ==============
async function figLightOk(base) {
  if (!LIGHT_FIG.has(base)) {
    try {
      const res = await fetch(base.replace(/\.html$/, "-light.html"), { method: "HEAD" });
      LIGHT_FIG.set(base, res.ok);
    } catch { LIGHT_FIG.set(base, false); }
  }
  return LIGHT_FIG.get(base);
}

function themedFigSrc(src) {
  const base = src.replace(/-light\.html$/, ".html");
  if (THEME !== "light") return Promise.resolve(base);
  return figLightOk(base).then(ok => ok ? base.replace(/\.html$/, "-light.html") : base);
}

function applyTheme(t) {
  THEME = t;
  try { localStorage.setItem(THEME_KEY, t); } catch { }
  document.documentElement.classList.toggle("light", t === "light");
  const mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.setAttribute("content", t === "light" ? "#f4f6fa" : "#0f1115");
  const btn = document.getElementById("btnTheme");
  if (btn) btn.textContent = t === "light" ? "🌙" : "☀️";
  // 已渲染的图随主题切换（无 -light 变体的图保持原版）
  document.querySelectorAll(".fig-slot iframe").forEach(f => {
    const cur = f.getAttribute("src");
    if (cur && /\.html$/.test(cur)) {
      themedFigSrc(cur).then(s => { if (f.getAttribute("src") !== s) f.setAttribute("src", s); });
    }
  });
}

// ============== 全文搜索 ==============
function stripMd(s) {
  return String(s)
    .replace(/```[a-zA-Z0-9]*\n?/g, "")
    .replace(/^#{1,4}\s+/gm, "")
    .replace(/\*\*/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function snippet(text, q, span) {
  const t = stripMd(text);
  const lower = q.toLowerCase();
  const idx = t.toLowerCase().indexOf(lower);
  if (idx < 0) return "";
  const a = Math.max(0, idx - span);
  const b = Math.min(t.length, idx + q.length + span);
  const seg = t.slice(a, b);
  const i2 = seg.toLowerCase().indexOf(lower);
  return (a > 0 ? "…" : "") +
    escapeHtml(seg.slice(0, i2)) +
    "<mark>" + escapeHtml(seg.slice(i2, i2 + q.length)) + "</mark>" +
    escapeHtml(seg.slice(i2 + q.length)) +
    (b < t.length ? "…" : "");
}

async function ensureIndex(onProgress) {
  if (SEARCH_INDEX_READY || INDEXING) return;
  INDEXING = true;
  try {
    const missing = DAYS.map(x => x.day).filter(d => !CONTENT.has(d));
    let done = 0;
    for (let i = 0; i < missing.length; i += 16) {
      await Promise.all(missing.slice(i, i + 16).map(d =>
        ensureContent(d).catch(() => { }).then(() => { done++; if (onProgress) onProgress(done, missing.length); })
      ));
    }
    SEARCH_INDEX_READY = true;
  } finally {
    INDEXING = false;
  }
}

function showSearch(q) {
  VIEW = "search";
  const content = document.getElementById("content");
  const needle = q.toLowerCase();
  const results = [];
  for (const d of DAYS) {
    const c = CONTENT.get(d.day);
    const snips = [];
    const tSnip = d.title.toLowerCase().includes(needle) ? snippet(d.title, q, 26) : "";
    const sSnip = d.summary && d.summary.toLowerCase().includes(needle) ? snippet(d.summary, q, 40) : "";
    if (tSnip || sSnip) snips.push('<span class="sr-sec">概览</span>' + (tSnip || sSnip));
    if (c) {
      (c.sections || []).forEach(s => {
        const sn = s.md && s.md.toLowerCase().includes(needle) ? snippet(s.md, q, 46) : "";
        const hHit = s.h && s.h.toLowerCase().includes(needle);
        if (sn || hHit) snips.push('<span class="sr-sec">' + escapeHtml(s.h || "") + '</span>' + (sn || snippet(s.md || "", q, 46)));
      });
      (c.keyPoints || []).forEach(k => {
        const sn = snippet(k, q, 46);
        if (sn) snips.push('<span class="sr-sec">要点</span>' + sn);
      });
    }
    if (snips.length) results.push({ day: d.day, title: d.title, hours: d.hours, snips: snips.slice(0, 3), more: snips.length - 3 });
  }
  setHTML(content, `
    <div class="sr-head">搜索「${escapeHtml(q)}」 · 命中 ${results.length} 天${SEARCH_INDEX_READY ? "" : ` · ⏳ 索引载入中 ${CONTENT.size}/${DAYS.length}，结果可能不全`}</div>
    ${results.map(r => `
      <a class="sr-item" href="#day-${r.day}">
        <div class="sr-title">
          <span class="sr-day">Day ${r.day}</span><span>${escapeHtml(r.title)}</span>
          <span class="day-hours">${r.hours}h</span>
          ${r.more > 0 ? `<span style="margin-left:auto;font-size:11px;color:var(--text-dim)">+${r.more} 处</span>` : ""}
        </div>
        ${r.snips.map(s => `<div class="sr-snip">${s}</div>`).join("")}
      </a>`).join("")}
    ${results.length ? "" : '<div class="rv-empty">没有找到相关内容<br><span style="font-size:12px">支持标题 / 小节 / 正文 / 要点关键词</span></div>'}
    <button class="back-btn" id="backDay">← 返回 Day ${CURRENT_DAY}</button>
  `);
  content.querySelectorAll(".sr-item").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      showDay(+el.getAttribute("href").slice(5));
    });
  });
  document.getElementById("backDay").addEventListener("click", () => showDay(CURRENT_DAY));
}

// ============== 错题复习 ==============
async function showReview() {
  VIEW = "review";
  const content = document.getElementById("content");
  const entries = Object.values(WRONG);
  if (!entries.length) {
    setHTML(content, `<div class="rv-empty">🎉 错题本是空的<br>
      <span style="font-size:12px;color:var(--text-dim)">测验做错的题会自动收进来，复习答对后自动移出</span><br>
      <button class="back-btn" id="backDay">← 返回 Day ${CURRENT_DAY}</button></div>`);
    document.getElementById("backDay").addEventListener("click", () => showDay(CURRENT_DAY));
    return;
  }
  setHTML(content, '<div class="study-loading">⏳ 正在收集错题…</div>');
  const total = entries.length;
  const pool = [...entries].sort(() => Math.random() - 0.5).slice(0, 12);
  const qs = [];
  for (const e of pool) {
    try {
      const c = await ensureContent(e.day);
      const q = (c.quiz || [])[e.qi];
      const meta = DAYS.find(x => x.day === e.day);
      if (q) qs.push({ day: e.day, qi: e.qi, q, dayTitle: meta ? meta.title : "" });
    } catch (err) { /* 单日内容加载失败则跳过 */ }
  }
  renderReview(qs, total);
}

function renderReview(qs, totalBefore) {
  const content = document.getElementById("content");
  if (!qs.length) {
    setHTML(content, '<div class="rv-empty">错题内容暂时加载失败，请稍后再试</div>');
    return;
  }
  setHTML(content, `
    <div class="quiz" id="reviewBox" style="margin-top:0">
      <div class="quiz-head"><span>🔁 错题复习</span><span class="quiz-rule">随机 ${qs.length} 题 / 错题本共 ${totalBefore} 题 · 答对自动移出</span></div>
      ${qs.map((it, i) => `
        <div class="quiz-q" data-qi="${i}">
          <div class="rv-q-tag">Day ${it.day} · ${escapeHtml(it.dayTitle)}</div>
          <div class="qq"><span class="qn">${i + 1}</span><span>${escapeHtml(it.q.q)}</span></div>
          ${it.q.options.map((o, j) => `<label class="qo"><input type="radio" name="rq${i}" value="${j}"><span>${mdInline(o)}</span></label>`).join("")}
          <div class="q-explain">💡 ${escapeHtml(it.q.explain || "")}</div>
        </div>`).join("")}
      <div class="quiz-warn"></div>
      <div class="quiz-result"></div>
      <div class="quiz-actions">
        <button class="quiz-submit">提交答案</button>
        <button class="quiz-retry" style="display:none">换一组错题</button>
        <button class="back-btn" id="backDay2">← 返回</button>
      </div>
    </div>`);
  const box = document.getElementById("reviewBox");
  const submit = box.querySelector(".quiz-submit");
  const retry = box.querySelector(".quiz-retry");
  document.getElementById("backDay2").addEventListener("click", () => showDay(CURRENT_DAY));
  submit.addEventListener("click", () => {
    const answers = qs.map((_, i) => {
      const sel = box.querySelector(`input[name="rq${i}"]:checked`);
      return sel ? +sel.value : -1;
    });
    const warn = box.querySelector(".quiz-warn");
    const unanswered = answers.filter(a => a < 0).length;
    if (unanswered > 0) {
      warn.textContent = `还有 ${unanswered} 题未作答，全部作答后才能提交`;
      warn.style.display = "block";
      return;
    }
    warn.style.display = "none";
    let score = 0;
    qs.forEach((it, i) => {
      const wrap = box.querySelector(`.quiz-q[data-qi="${i}"]`);
      const ok = answers[i] === it.q.answer;
      if (ok) score++;
      wrap.classList.add(ok ? "correct" : "wrong");
      wrap.querySelectorAll(".qo").forEach((lab, j) => {
        if (j === it.q.answer) lab.classList.add("is-answer");
        else if (j === answers[i]) lab.classList.add("is-wrong");
      });
      const ex = wrap.querySelector(".q-explain");
      if (ex) ex.style.display = "block";
      const k = it.day + "-" + it.qi;
      if (ok) delete WRONG[k];
      else WRONG[k].addedAt = Date.now();
    });
    saveWrong(); updateWrongBtn();
    const res = box.querySelector(".quiz-result");
    const left = Object.keys(WRONG).length;
    res.className = "quiz-result " + (score === qs.length ? "pass" : "fail");
    setHTML(res, `<span>答对 ${score}/${qs.length}</span><span class="res-tag">错题本剩余 ${left} 题${left ? "，点「换一组」继续" : "，全部清空 🎉"}</span>`);
    submit.style.display = "none";
    retry.style.display = "inline-block";
    res.scrollIntoView({ block: "center", behavior: "smooth" });
  });
  retry.addEventListener("click", () => showReview());
}

// ============== 搜索框 / 错题按钮 / 快捷键 ==============
function bindExtras() {
  const si = document.getElementById("searchInput");
  let debTimer = null;
  si.addEventListener("input", () => {
    clearTimeout(debTimer);
    debTimer = setTimeout(() => {
      const q = si.value.trim();
      if (q.length >= 2) {
        showSearch(q);
        if (!SEARCH_INDEX_READY) {
          ensureIndex(() => {
            const cur = si.value.trim();
            if (cur.length >= 2 && VIEW === "search") showSearch(cur);
          });
        }
      } else if (VIEW === "search") {
        showDay(CURRENT_DAY);
      }
    }, 250);
  });
  document.getElementById("btnTheme").addEventListener("click", () => applyTheme(THEME === "dark" ? "light" : "dark"));
  document.getElementById("btnReview").addEventListener("click", () => showReview());
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && VIEW !== "day") { showDay(CURRENT_DAY); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (e.key === "ArrowLeft" && VIEW === "day" && CURRENT_DAY > 1) showDay(CURRENT_DAY - 1);
    else if (e.key === "ArrowRight" && VIEW === "day" && CURRENT_DAY < DAYS.length) showDay(CURRENT_DAY + 1);
  });
}

// ============== init ==============
async function init() {
  loadState();
  applyTheme(document.documentElement.classList.contains("light") ? "light" : "dark");
  updateWrongBtn();
  bindIoButtons();
  bindExtras();
  try {
    const res = await fetch("days.json");
    DAYS = await res.json();
  } catch (e) {
    setHTML(document.getElementById("content"), `<div class="empty"><h2>加载失败</h2><p>无法读取 <code>days.json</code>。请确认通过 http(s):// 访问（不要用 file:// 双击打开），且站点文件完整。</p></div>`);
    return;
  }
  buildSidebar();
  updateProgress();
  const hashDay = location.hash.match(/^#day-(\d+)$/);
  showDay(hashDay ? Math.min(160, Math.max(1, +hashDay[1])) : CURRENT_DAY);
  // PWA 离线：注册 service worker（外壳预缓存；浏览过/搜索过的天自动进缓存）
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("sw.js").catch(() => { });
  }
}

// hash 变化（浏览器后退/前进、外部链接）时同步切换 day
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/^#day-(\d+)$/);
  if (m) showDay(Math.min(160, Math.max(1, +m[1])));
});

init();
</script>
</body>
</html>
